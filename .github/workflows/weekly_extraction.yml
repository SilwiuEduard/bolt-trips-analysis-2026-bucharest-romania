name: Weekly Bolt Data Extraction & Transformation v2

on:
  schedule:
    # Ruleaza in fiecare Luni la ora 03:00 UTC (06:00 dimineata ora Romaniei)
    - cron: "0 3 * * 1"
  workflow_dispatch: # Iti permite sa pornesti rularea si MANUAL din interfata GitHub oricand doresti

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyarrow requests python-dotenv azure-storage-blob

      # --- PASUL 1 & 2 & 3: Extragere si Upload in Azure Bronze ---
      - name: Run Extraction & Upload to Azure Bronze
        env:
          BOLT_CLIENT_ID: ${{ secrets.BOLT_CLIENT_ID }}
          BOLT_CLIENT_SECRET: ${{ secrets.BOLT_CLIENT_SECRET }}
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
        run: |
          python python/bolt_fleet_extractor.py

      # --- PASUL 4: Autentificare Google Cloud / BigQuery ---
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # --- PASUL 5: Rulare Script DDL (Create/Replace View) ---
      - name: Create or Replace Silver Orders View
        run: |
          bq query --use_legacy_sql=false < sql/create_silver_orders.sql

      # --- PASUL 6: Export catre Azure Silver Storage ---
      - name: Export Silver Orders Data to Azure Storage
        run: |
          bq query --use_legacy_sql=false < sql/export_silver_orders.sql
